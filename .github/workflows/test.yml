name: Tests

on:
  push:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Picks up the Python version pinned in backend/.python-version,
      # downloading it if the runner doesn't already have it.
      - run: uv sync --locked

      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-chats
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-chats/package-lock.json

      - run: npm ci
      - run: npm run test

  course-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: course-site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: course-site/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Also prerenders every page, so a broken chapter file fails here.
      - run: npm run build
